<title>BPMN Process Modeling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  /* ---- layout concept: fixed left rail of section nav (collapses to sticky
     top tabs on phone) + scrolling content column of cards; every concept,
     quiz and exercise is a .card; BPMN diagrams render as inline SVG whose
     element colors follow a fixed Bizagi-style semantic palette that does
     NOT change with the page theme (diagrams always read like print) ---- */
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#eef0ee; --fg:#1b1f1d; --fg-muted:#5b625e;
  --border:#dcdfdb; --accent:#1f6f5c; --accent-2:#b2542a; --accent-soft:#e3efe9;
  --success:#1f7a3d; --success-soft:#e3f3e5; --danger:#b3261e; --danger-soft:#fbe5e3;
  --warning:#8a6d00; --warning-soft:#fdf2cf;
  --font-head:"Space Grotesk",Inter,system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  /* BPMN semantic colors (Bizagi-style) — constant across themes */
  --bpmn-start-fill:#dcf3cf; --bpmn-start-stroke:#4c9f2f;
  --bpmn-end-fill:#fbd6d6; --bpmn-end-stroke:#c0392b;
  --bpmn-task-fill:#d9ecf8; --bpmn-task-stroke:#2e75b6;
  --bpmn-sub-fill:#cfe6f6; --bpmn-sub-stroke:#1f5c96;
  --bpmn-gw-fill:#ffefb0; --bpmn-gw-stroke:#c9960c;
  --bpmn-data-fill:#ffffff; --bpmn-data-stroke:#555555;
  --bpmn-pool-fill:#f4f4f2; --bpmn-pool-stroke:#9a9a94;
  --bpmn-lane-fill:#fbfbf9; --bpmn-lane-head:#e7e7e2;
  --bpmn-text:#17201b; --bpmn-text-vi:#4a564f;
  --flow-color:#4a4a46; --msg-color:#8a7a5a;
  --diagram-bg:#fcfbf8; --diagram-border:#ded9cc;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15180f; --surface:#1d2117; --surface-2:#262b1f; --fg:#eef0e6; --fg-muted:#aab2a0;
    --border:#38402f; --accent:#6fcf9e; --accent-2:#e0a06a; --accent-soft:#223229;
    --success:#7bd48f; --success-soft:#1d3322; --danger:#f2938c; --danger-soft:#3a2220;
    --warning:#f0cf63; --warning-soft:#332c10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15180f; --surface:#1d2117; --surface-2:#262b1f; --fg:#eef0e6; --fg-muted:#aab2a0;
  --border:#38402f; --accent:#6fcf9e; --accent-2:#e0a06a; --accent-soft:#223229;
  --success:#7bd48f; --success-soft:#1d3322; --danger:#f2938c; --danger-soft:#3a2220;
  --warning:#f0cf63; --warning-soft:#332c10;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body);
  font-size:15px; line-height:1.55;
  padding-left:max(0px, env(safe-area-inset-left,0px));
  padding-right:max(0px, env(safe-area-inset-right,0px));
}
h1,h2,h3,h4{font-family:var(--font-head); font-weight:600; text-wrap:balance; margin:0 0 .4em}
a{color:var(--accent)}
.app{display:flex; min-height:100%}
.rail{
  width:248px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; padding:18px 14px;
}
.rail-title{font-family:var(--font-head); font-size:15px; font-weight:700; margin-bottom:2px}
.rail-sub{font-size:11.5px; color:var(--fg-muted); margin-bottom:16px}
.rail nav{display:flex; flex-direction:column; gap:2px}
.rail button{
  all:unset; cursor:pointer; padding:9px 10px; border-radius:8px; font-size:13.5px;
  color:var(--fg-muted); display:flex; align-items:center; gap:8px; line-height:1.3;
}
.rail button .n{font-family:var(--font-mono); font-size:11px; color:var(--fg-muted); width:18px; flex:none}
.rail button:hover{background:var(--surface-2)}
.rail button.active{background:var(--accent-soft); color:var(--accent); font-weight:600}
.rail button.active .n{color:var(--accent)}
.rail-progress{margin-top:18px; padding-top:14px; border-top:1px solid var(--border)}
.rail-progress-label{font-size:11px; color:var(--fg-muted); display:flex; justify-content:space-between; margin-bottom:6px}
.bar{height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.bar>i{display:block; height:100%; background:var(--accent); border-radius:4px; transition:width .3s}
.topbar{
  display:none; position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--border); padding:10px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; padding-bottom:8px}
.topbar-row .rail-title{margin:0}
.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; -webkit-overflow-scrolling:touch}
.tabs button{all:unset; cursor:pointer; white-space:nowrap; font-size:12.5px; padding:7px 11px; border-radius:999px; background:var(--surface-2); color:var(--fg-muted)}
.tabs button.active{background:var(--accent); color:#fff}
main{flex:1; min-width:0}
.content{max-width:860px; margin:0 auto; padding:34px max(16px,env(safe-area-inset-left,0px)) 80px max(16px,env(safe-area-inset-right,0px))}
.section-head{margin-bottom:22px}
.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; font-weight:600}
.section-head h1{font-size:26px}
.section-sub{color:var(--fg-muted); font-size:14.5px; margin-top:4px}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 22px; margin-bottom:18px}
.card h3{font-size:16.5px; margin-bottom:10px; display:flex; align-items:center; gap:8px}
.card h3 .ico{width:22px;height:22px;flex:none}
.card p{margin:.4em 0}
.card ul{margin:.3em 0; padding-left:1.25em}
.card li{margin:.35em 0}
.vi{color:var(--fg-muted); font-size:.95em}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; letter-spacing:.02em; padding:3px 9px; border-radius:999px; text-transform:uppercase}
.badge.concept{background:var(--accent-soft); color:var(--accent)}
.badge.example{background:var(--warning-soft); color:var(--warning)}
.badge.exercise{background:#e8e2fb; color:#6a4fc4}
:root[data-theme="dark"] .badge.exercise, @media (prefers-color-scheme:dark){.badge.exercise{background:#2a2440;color:#c6b6f7}}
.diagram-wrap{background:var(--diagram-bg); border:1px solid var(--diagram-border); border-radius:10px; padding:10px; margin:12px 0; overflow-x:auto}
.diagram-wrap svg{display:block; margin:0 auto; min-width:560px}
.legend-toggle{all:unset; cursor:pointer; font-size:12px; color:var(--accent); font-weight:600; display:inline-flex; gap:5px; align-items:center; margin-top:2px}
.legend{display:none; flex-wrap:wrap; gap:10px 16px; font-size:12px; color:var(--fg-muted); margin-top:10px; padding-top:10px; border-top:1px dashed var(--border)}
.legend.open{display:flex}
.legend-item{display:flex; align-items:center; gap:6px}
.legend-sw{width:16px; height:16px; border-radius:4px; flex:none}
.quiz{border-left:3px solid var(--accent); padding-left:16px}
.quiz .q{font-weight:600; margin-bottom:2px}
.quiz .q .vi{display:block; font-weight:400; margin-top:2px}
.hint-btn{all:unset; cursor:pointer; font-size:12.5px; color:var(--accent-2); font-weight:600; margin:8px 0 2px; display:inline-flex; align-items:center; gap:5px}
.hint-box{display:none; background:var(--warning-soft); color:var(--warning); border-radius:8px; padding:8px 12px; font-size:13px; margin:6px 0}
.hint-box.open{display:block}
.opt-list{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
.opt{all:unset; cursor:pointer; display:flex; gap:10px; align-items:flex-start; border:1.5px solid var(--border); border-radius:10px; padding:10px 13px; font-size:13.8px; background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt .k{font-family:var(--font-mono); font-weight:700; color:var(--fg-muted); flex:none}
.opt.correct{border-color:var(--success); background:var(--success-soft)}
.opt.correct .k{color:var(--success)}
.opt.wrong{border-color:var(--danger); background:var(--danger-soft)}
.opt.wrong .k{color:var(--danger)}
.opt.dim{opacity:.55}
.feedback{display:none; margin-top:10px; border-radius:10px; padding:12px 14px; font-size:13.8px}
.feedback.open{display:block}
.feedback.ok{background:var(--success-soft); color:var(--success)}
.feedback.no{background:var(--danger-soft); color:var(--danger)}
.feedback b{display:block; margin-bottom:3px; font-size:13px}
.feedback .exp{color:var(--fg); font-weight:400; margin-top:4px}
.exercise-scenario{background:var(--surface-2); border-radius:10px; padding:12px 15px; font-size:13.8px; margin-bottom:12px}
.reveal-btn{all:unset; cursor:pointer; font-size:13px; font-weight:600; color:#fff; background:var(--accent); padding:9px 16px; border-radius:8px; display:inline-block; margin-top:10px}
.reveal-btn:disabled{opacity:.5; cursor:default}
.solution{display:none; margin-top:14px; border-top:1px dashed var(--border); padding-top:14px}
.solution.open{display:block}
.check-list{display:flex; flex-direction:column; gap:7px; margin:10px 0 0; padding:0; list-style:none}
.check-list li{display:flex; gap:8px; font-size:13.3px}
.check-list li::before{content:"✓"; color:var(--success); font-weight:700; flex:none}
.final-score{font-family:var(--font-mono); font-weight:700}
footer.credits{text-align:center; color:var(--fg-muted); font-size:12px; padding:30px 16px 50px}
@media (max-width:860px){
  .rail{display:none}
  .topbar{display:block}
  .content{padding-top:18px}
}
</style>

<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-title">BPMN · Process Modeling</div>
    <div class="rail-sub">Mô hình hóa quy trình với BPMN</div>
    <nav id="railNav"></nav>
    <div class="rail-progress">
      <div class="rail-progress-label"><span>Progress (Tiến độ)</span><span id="progressLabel">0%</span></div>
      <div class="bar"><i id="progressBar" style="width:0%"></i></div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="topbar-row">
        <div>
          <div class="rail-title">BPMN · Process Modeling</div>
        </div>
        <div style="font-size:11px;color:var(--fg-muted)"><span id="progressLabelTop">0%</span></div>
      </div>
      <div class="tabs" id="tabsNav"></div>
    </div>
    <div class="content" id="content"></div>
    <footer class="credits">Dumas, La Rosa, Mendling &amp; Reijers — <i>Fundamentals of Business Process Management</i>, 2nd ed. (Springer, 2018), Chương 3. Sơ đồ vẽ lại dạng BPMN, tô màu theo quy ước thường gặp trong Bizagi Modeler.</footer>
  </main>
</div>

<script>
/* ============================================================
   0. SMALL UTILITIES
   ============================================================ */
const el = (tag, attrs={}, html) => {
  const n = document.createElement(tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (html !== undefined) n.innerHTML = html;
  return n;
};
function store(key, val){ try{ if(val===undefined){return JSON.parse(localStorage.getItem(key));} localStorage.setItem(key, JSON.stringify(val)); }catch(e){ return val===undefined? null : undefined; } }

/* ============================================================
   1. BPMN DIAGRAM ENGINE
   A tiny recursive flow-layout compiler + SVG renderer.
   Item kinds: start,end,task,subprocess,dataobject,datastore
               {branch:[[items],[items],...], gw:'xor'|'and'|'or', condLabels:[]}
               {loop:[items], exitLabel, repeatLabel}
   ============================================================ */
const EVR=16, GWS=36, TW=122, TH=56, GAP=42, ROW=92;

function rowOffsets(n){
  if(n===1) return [0];
  if(n===2) return [-ROW/2, ROW/2];
  if(n===3) return [-ROW, 0, ROW];
  const out=[]; const span=(n-1)*ROW; for(let i=0;i<n;i++) out.push(-span/2+i*ROW); return out;
}

function makeNode(id,type,x,y,w,h,label,labelVI,extra){
  return {id,type,x,y,w:w||( (type==='task'||type==='subprocess')?TW:(type==='datastore'?58:(type==='dataobject'?46:GWS)) ),
          h:h||( (type==='task'||type==='subprocess')?TH:(type==='datastore'?58:(type==='dataobject'?58:GWS)) ),
          label:label||'', labelVI:labelVI||'', extra:extra||{}};
}
function edge(from,to,label,extra){ return Object.assign({from,to,label:label||''}, extra||{}); }

function layout(items, x0, y, idPrefix){
  let nodes=[], edges=[], cx=x0, prevId=null, firstId=null, pendingLabel=null;
  let minY=y, maxY=y, counter=0;
  for(const item of items){
    counter++;
    if(item.branch){
      const gw='gw_'+item.gw;
      const sp=makeNode(idPrefix+'s'+counter, gw, cx+GWS/2, y);
      nodes.push(sp);
      if(prevId) edges.push(edge(prevId, sp.id, pendingLabel)); pendingLabel=null;
      const bx = cx+GWS+GAP;
      const offs = item.rowOffsets || rowOffsets(item.branch.length);
      let ends=[], firsts=[], lasts=[];
      item.branch.forEach((sub,i)=>{
        const subY = y+offs[i];
        const r = layout(sub, bx, subY, idPrefix+'b'+counter+'_'+i+'_');
        nodes.push(...r.nodes); edges.push(...r.edges);
        minY=Math.min(minY,r.minY); maxY=Math.max(maxY,r.maxY,subY);
        if(r.nodes.length===0){ ends.push(bx); firsts.push(null); lasts.push(null); }
        else{ ends.push(r.endX); firsts.push(r.firstId); lasts.push(r.lastId);
              edges.push(edge(sp.id, r.firstId, item.condLabels&&item.condLabels[i])); }
      });
      const maxEnd = Math.max(...ends);
      const jp = makeNode(idPrefix+'j'+counter, gw, maxEnd+GAP+GWS/2, y);
      nodes.push(jp);
      lasts.forEach((lid,i)=>{ if(lid) edges.push(edge(lid, jp.id)); else edges.push(edge(sp.id, jp.id, item.condLabels&&item.condLabels[i])); });
      prevId = jp.id; if(!firstId) firstId=sp.id;
      cx = jp.x + GWS/2 + GAP;
    } else if(item.loop){
      const mg = makeNode(idPrefix+'m'+counter,'gw_xor', cx+GWS/2, y);
      nodes.push(mg);
      if(prevId) edges.push(edge(prevId, mg.id, pendingLabel)); pendingLabel=null;
      const bx = cx+GWS+GAP;
      const body = layout(item.loop, bx, y, idPrefix+'lp'+counter+'_');
      nodes.push(...body.nodes); edges.push(...body.edges);
      edges.push(edge(mg.id, body.firstId));
      minY=Math.min(minY, body.minY); maxY=Math.max(maxY, body.maxY);
      const sx = body.endX + GAP + GWS/2;
      const sp = makeNode(idPrefix+'ls'+counter,'gw_xor', sx, y);
      nodes.push(sp);
      edges.push(edge(body.lastId, sp.id));
      const loopY = y + 82;
      edges.push(edge(sp.id, mg.id, item.repeatLabel, {loopBack:true, loopY}));
      maxY = Math.max(maxY, loopY+22);
      prevId = sp.id; if(!firstId) firstId = mg.id;
      pendingLabel = item.exitLabel;
      cx = sp.x + GWS/2 + GAP;
    } else {
      const node = makeNode(idPrefix+'n'+counter, item.type, cx, y, item.w, item.h, item.label, item.labelVI, item.extra);
      node.x = cx + node.w/2;
      nodes.push(node);
      if(prevId){ edges.push(edge(prevId, node.id, pendingLabel)); pendingLabel=null; }
      prevId = node.id; if(!firstId) firstId = node.id;
      cx += node.w + GAP;
      minY=Math.min(minY,y); maxY=Math.max(maxY,y);
    }
  }
  return {nodes, edges, endX: cx-GAP, firstId, lastId: prevId, minY, maxY, pendingLabel};
}

function edgePoint(n, dir){
  // dir: approximate direction ('r','l') just for horizontal connections we use most
  const halfw = n.w/2, halfh=n.h/2;
  if(n.type==='task'||n.type==='subprocess') return {r:{x:n.x+halfw,y:n.y}, l:{x:n.x-halfw,y:n.y}, t:{x:n.x,y:n.y-halfh}, b:{x:n.x,y:n.y+halfh}};
  if(n.type==='dataobject') return {r:{x:n.x+halfw,y:n.y}, l:{x:n.x-halfw,y:n.y}, t:{x:n.x,y:n.y-halfh}, b:{x:n.x,y:n.y+halfh}};
  // circle/diamond-ish: use radius
  const r = n.w/2;
  return {r:{x:n.x+r,y:n.y}, l:{x:n.x-r,y:n.y}, t:{x:n.x,y:n.y-r}, b:{x:n.x,y:n.y+r}};
}

function shapeSVG(n){
  const label = n.label ? `<div style="font:600 11.5px/1.25 Inter,sans-serif;color:var(--bpmn-text)">${n.label}</div>` : '';
  const vi = n.labelVI ? `<div style="font:italic 10px/1.2 Inter,sans-serif;color:var(--bpmn-text-vi);margin-top:2px">${n.labelVI}</div>` : '';
  const capLabel = (yOff) => n.label ? `<foreignObject x="${n.x-70}" y="${n.y+yOff}" width="140" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center">${label}${vi}</div></foreignObject>` : '';
  switch(n.type){
    case 'start':
      return `<circle cx="${n.x}" cy="${n.y}" r="${EVR}" style="fill:var(--bpmn-start-fill);stroke:var(--bpmn-start-stroke);stroke-width:2.2"/>${capLabel(EVR+6)}`;
    case 'end':
      return `<circle cx="${n.x}" cy="${n.y}" r="${EVR}" style="fill:var(--bpmn-end-fill);stroke:var(--bpmn-end-stroke);stroke-width:4"/>${capLabel(EVR+6)}`;
    case 'msgstart':
      return `<circle cx="${n.x}" cy="${n.y}" r="${EVR}" style="fill:var(--bpmn-start-fill);stroke:var(--bpmn-start-stroke);stroke-width:2.2"/>
              <rect x="${n.x-8}" y="${n.y-5.5}" width="16" height="11" rx="1" style="fill:none;stroke:var(--bpmn-start-stroke);stroke-width:1.3"/>
              <path d="M${n.x-8} ${n.y-5.5} L${n.x} ${n.y+1.5} L${n.x+8} ${n.y-5.5}" style="fill:none;stroke:var(--bpmn-start-stroke);stroke-width:1.3"/>
              ${capLabel(EVR+6)}`;
    case 'task': {
      const x=n.x-n.w/2, y=n.y-n.h/2;
      return `<rect x="${x}" y="${y}" width="${n.w}" height="${n.h}" rx="9" style="fill:var(--bpmn-task-fill);stroke:var(--bpmn-task-stroke);stroke-width:1.8"/>
              <foreignObject x="${x+6}" y="${y+4}" width="${n.w-12}" height="${n.h-8}"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center">${label}${vi}</div></foreignObject>`;
    }
    case 'subprocess': {
      const x=n.x-n.w/2, y=n.y-n.h/2;
      return `<rect x="${x}" y="${y}" width="${n.w}" height="${n.h}" rx="9" style="fill:var(--bpmn-sub-fill);stroke:var(--bpmn-sub-stroke);stroke-width:1.8"/>
              <foreignObject x="${x+6}" y="${y+4}" width="${n.w-12}" height="${n.h-16}"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center">${label}${vi}</div></foreignObject>
              <rect x="${n.x-8}" y="${y+n.h-13}" width="16" height="12" rx="2" style="fill:#fff;stroke:var(--bpmn-sub-stroke);stroke-width:1.2"/>
              <line x1="${n.x-5}" y1="${y+n.h-7}" x2="${n.x+5}" y2="${y+n.h-7}" style="stroke:var(--bpmn-sub-stroke);stroke-width:1.3"/>
              <line x1="${n.x}" y1="${y+n.h-10}" x2="${n.x}" y2="${y+n.h-4}" style="stroke:var(--bpmn-sub-stroke);stroke-width:1.3"/>`;
    }
    case 'gw_xor': case 'gw_and': case 'gw_or': {
      const r=GWS/2;
      const pts=`${n.x},${n.y-r} ${n.x+r},${n.y} ${n.x},${n.y+r} ${n.x-r},${n.y}`;
      let mark='';
      if(n.type==='gw_xor') mark=`<path d="M${n.x-7} ${n.y-7} L${n.x+7} ${n.y+7} M${n.x+7} ${n.y-7} L${n.x-7} ${n.y+7}" style="stroke:var(--bpmn-gw-stroke);stroke-width:2.4"/>`;
      if(n.type==='gw_and') mark=`<path d="M${n.x} ${n.y-8} V${n.y+8} M${n.x-8} ${n.y} H${n.x+8}" style="stroke:var(--bpmn-gw-stroke);stroke-width:2.4"/>`;
      if(n.type==='gw_or') mark=`<circle cx="${n.x}" cy="${n.y}" r="7" style="fill:none;stroke:var(--bpmn-gw-stroke);stroke-width:2.2"/>`;
      return `<polygon points="${pts}" style="fill:var(--bpmn-gw-fill);stroke:var(--bpmn-gw-stroke);stroke-width:2"/>${mark}${capLabel(r+8)}`;
    }
    case 'dataobject': {
      const x=n.x-n.w/2, y=n.y-n.h/2, w=n.w,h=n.h,fold=10;
      return `<path d="M${x} ${y} H${x+w-fold} L${x+w} ${y+fold} V${y+h} H${x} Z" style="fill:var(--bpmn-data-fill);stroke:var(--bpmn-data-stroke);stroke-width:1.4"/>
              <path d="M${x+w-fold} ${y} V${y+fold} H${x+w}" style="fill:none;stroke:var(--bpmn-data-stroke);stroke-width:1.2"/>
              <line x1="${x+6}" y1="${y+h-16}" x2="${x+w-6}" y2="${y+h-16}" style="stroke:var(--bpmn-data-stroke);stroke-width:1"/>
              <line x1="${x+6}" y1="${y+h-10}" x2="${x+w-10}" y2="${y+h-10}" style="stroke:var(--bpmn-data-stroke);stroke-width:1"/>
              ${capLabel(n.h/2+6)}`;
    }
    case 'datastore': {
      const x=n.x-n.w/2, y=n.y-n.h/2, w=n.w,h=n.h,ell=8;
      return `<path d="M${x} ${y+ell} V${y+h-ell} A${w/2} ${ell} 0 0 0 ${x+w} ${y+h-ell} V${y+ell}" style="fill:var(--bpmn-data-fill);stroke:var(--bpmn-data-stroke);stroke-width:1.4"/>
              <ellipse cx="${n.x}" cy="${y+ell}" rx="${w/2}" ry="${ell}" style="fill:var(--bpmn-data-fill);stroke:var(--bpmn-data-stroke);stroke-width:1.4"/>
              ${capLabel(n.h/2+6)}`;
    }
    default: return '';
  }
}

function edgesSVG(nodes, edges, uid){
  const byId={}; nodes.forEach(n=>byId[n.id]=n);
  let out='';
  edges.forEach((e,i)=>{
    const a=byId[e.from], b=byId[e.to]; if(!a||!b) return;
    const msg = e.msg;
    const marker = msg? `url(#amsg-${uid})` : `url(#aseq-${uid})`;
    const dash = msg? 'stroke-dasharray="5 4"' : '';
    const color = msg? 'var(--msg-color)' : 'var(--flow-color)';
    let d;
    if(e.loopBack){
      const pa=edgePoint(a,'b').b, pb=edgePoint(b,'b').b;
      d=`M${pa.x} ${pa.y} V${e.loopY} H${pb.x} V${pb.y}`;
      out+=`<path d="${d}" style="fill:none;stroke:${color};stroke-width:1.7" marker-end="${marker}" ${dash}/>`;
      if(e.label) out+=`<foreignObject x="${(pa.x+pb.x)/2-60}" y="${e.loopY-19}" width="120" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font:600 10.5px Inter,sans-serif;color:var(--bpmn-text-vi);background:var(--diagram-bg);display:inline-block;padding:0 4px;margin:0 auto">${e.label}</div></foreignObject>`;
      return;
    }
    const pa = a.y===b.y ? edgePoint(a,'r').r : (a.y<b.y? edgePoint(a,'b').b : edgePoint(a,'t').t);
    const pb = a.y===b.y ? edgePoint(b,'l').l : edgePoint(b,'l').l;
    if(a.y===b.y){
      d=`M${pa.x} ${pa.y} H${pb.x}`;
    } else {
      const midx=(pa.x+pb.x)/2;
      d=`M${pa.x} ${pa.y} H${midx} V${b.y} H${pb.x}`;
    }
    out+=`<path d="${d}" style="fill:none;stroke:${color};stroke-width:1.7" marker-end="${marker}" ${dash}/>`;
    if(e.label){
      const lx = a.y===b.y ? (pa.x+pb.x)/2 : (pa.x+ (pa.y<pb.y? pb.x:pb.x))/2 ;
      const ly = a.y===b.y ? pa.y-13 : (pa.y+b.y)/2 - (a.y<b.y?6:-6);
      out+=`<foreignObject x="${lx-62}" y="${ly-11}" width="124" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font:600 10.5px Inter,sans-serif;color:var(--bpmn-text-vi);background:var(--diagram-bg);display:inline-block;padding:0 4px">${e.label}</div></foreignObject>`;
    }
  });
  return out;
}

function composeRows(rows, idPrefix){
  // rows: [{items, y}], laid out left-to-right, each row continuing the x
  // cursor from the previous row and connected to it by an edge.
  let nodes=[], edges=[], x=80, prevLast=null, firstId=null, minY=Infinity, maxY=-Infinity;
  rows.forEach((row,i)=>{
    const r = layout(row.items, x, row.y, idPrefix+'row'+i+'_');
    nodes.push(...r.nodes); edges.push(...r.edges);
    if(prevLast) edges.push(edge(prevLast, r.firstId));
    prevLast = r.lastId; if(!firstId) firstId = r.firstId;
    x = r.endX + GAP;
    minY = Math.min(minY, r.minY); maxY = Math.max(maxY, r.maxY);
  });
  return {nodes, edges, endX:x-GAP, firstId, lastId:prevLast, minY, maxY};
}

function renderDiagram(spec){
  const uid = 'd'+Math.random().toString(36).slice(2,8);
  const r = spec.rows ? composeRows(spec.rows, 'r_') : layout(spec.items, 80, (spec.mainY!==undefined?spec.mainY:90), 'r_');
  let laneSVG='';
  const minY = Math.min(r.minY, ...(spec.lanes? spec.lanes.map(l=>l.yTop):[r.minY]));
  const maxY = Math.max(r.maxY, ...(spec.lanes? spec.lanes.map(l=>l.yBottom):[r.maxY]));
  const W = r.endX + 40, H = (maxY-minY) + 60;
  const padTop = 30 - minY;
  if(spec.lanes){
    spec.lanes.forEach((l,i)=>{
      laneSVG += `<rect x="4" y="${l.yTop+padTop}" width="${W-8}" height="${l.yBottom-l.yTop}" style="fill:${i%2?'var(--bpmn-lane-fill)':'var(--bpmn-pool-fill)'};stroke:var(--bpmn-pool-stroke);stroke-width:1"/>
                  <foreignObject x="8" y="${l.yTop+padTop+3}" width="230" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 9.5px/1.25 Inter,sans-serif;color:var(--bpmn-text-vi)">${l.label}</div></foreignObject>`;
    });
  }
  const shiftedNodes = r.nodes.map(n=>Object.assign({},n,{y:n.y+padTop}));
  const shiftedEdges = r.edges.map(e=>Object.assign({},e, e.loopBack?{loopY:e.loopY+padTop}:{}));
  const idMap={}; shiftedNodes.forEach(n=>idMap[n.id]=n);
  let extraMsg='';
  if(spec.messageFlows){
    spec.messageFlows.forEach(mf=>{
      const a=mf.fromXY, b=idMap[mf.to];
      if(!b) return;
      const by = edgePoint(b,'t').t;
      extraMsg += `<path d="M${a.x} ${a.y} V${by.y-18} H${by.x} V${by.y}" style="fill:none;stroke:var(--msg-color);stroke-width:1.6" stroke-dasharray="5 4" marker-end="url(#amsg-${uid})"/>`;
      if(mf.label) extraMsg += `<foreignObject x="${a.x-55}" y="${(a.y+by.y)/2-28}" width="110" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font:600 10px Inter,sans-serif;color:var(--msg-color)">${mf.label}</div></foreignObject>`;
    });
  }
  const nodesMarkup = shiftedNodes.map(shapeSVG).join('');
  const edgesMarkup = edgesSVG(shiftedNodes, shiftedEdges, uid);
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="aseq-${uid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--flow-color)"/></marker>
      <marker id="amsg-${uid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:var(--msg-color)"/></marker>
    </defs>
    ${laneSVG}${edgesMarkup}${extraMsg}${nodesMarkup}
  </svg>`;
  const wrap = el('div',{class:'diagram-wrap'});
  wrap.innerHTML = svg;
  return wrap;
}

const LEGEND_ITEMS = [
  ['var(--bpmn-start-fill)','Start event (Sự kiện bắt đầu)'],
  ['var(--bpmn-end-fill)','End event (Sự kiện kết thúc)'],
  ['var(--bpmn-task-fill)','Task / Activity (Hoạt động)'],
  ['var(--bpmn-sub-fill)','Sub-process (Quy trình con)'],
  ['var(--bpmn-gw-fill)','Gateway — X=XOR, +=AND, O=OR (Cổng)'],
  ['var(--bpmn-data-fill)','Data object / store (Đối tượng/kho dữ liệu)'],
  ['var(--bpmn-pool-fill)','Pool / Lane (Bể / Làn)'],
];
function legendBlock(){
  const wrap = el('div');
  const btn = el('button',{class:'legend-toggle'}, '🎨 Diagram color key (Chú giải màu sắc BPMN)');
  const leg = el('div',{class:'legend'});
  LEGEND_ITEMS.forEach(([c,t])=>{
    const it = el('div',{class:'legend-item'});
    it.appendChild(el('span',{class:'legend-sw', style:`background:${c};border:1px solid var(--border)`}));
    it.appendChild(el('span',{},t));
    leg.appendChild(it);
  });
  btn.onclick=()=>leg.classList.toggle('open');
  wrap.appendChild(btn); wrap.appendChild(leg);
  return wrap;
}

/* ============================================================
   2. QUIZ & EXERCISE COMPONENTS
   ============================================================ */
let QUIZ_REGISTRY = new Set();

function quizBlock(spec){
  const storageKey = 'q_'+spec.id;
  QUIZ_REGISTRY.add(storageKey);
  const saved = store(storageKey);
  const wrap = el('div',{class:'quiz'});
  wrap.appendChild(el('div',{class:'q'}, spec.q + (spec.qvi?`<span class="vi">${spec.qvi}</span>`:'')));
  let hintBtn=null, hintBox=null;
  if(spec.hint){
    hintBtn = el('button',{class:'hint-btn'}, '💡 Hint (Gợi ý)');
    hintBox = el('div',{class:'hint-box'}, spec.hint);
    hintBtn.onclick=()=>{ hintBox.classList.toggle('open'); };
    wrap.appendChild(hintBtn); wrap.appendChild(hintBox);
  }
  const list = el('ul',{class:'opt-list'});
  const fb = el('div',{class:'feedback'});
  const letters='ABCD';
  const buttons=[];
  spec.options.forEach((opt,i)=>{
    const li = el('li');
    const b = el('button',{class:'opt'});
    b.appendChild(el('span',{class:'k'},letters[i]));
    b.appendChild(el('span',{},opt.t));
    b.onclick=()=>{
      buttons.forEach(x=>x.classList.remove('correct','wrong'));
      spec.options.forEach((o,j)=>{ if(o.correct) buttons[j].classList.add('correct'); });
      if(!opt.correct) b.classList.add('wrong');
      fb.className='feedback open '+(opt.correct?'ok':'no');
      fb.innerHTML = `<b>${opt.correct? '✓ Correct! (Chính xác!)' : '✗ Not quite (Chưa đúng)'}</b><span class="exp">${spec.explain}</span>`;
      store(storageKey, opt.correct);
      updateProgress();
    };
    buttons.push(b);
    li.appendChild(b); list.appendChild(li);
  });
  wrap.appendChild(list); wrap.appendChild(fb);
  if(saved===true){
    spec.options.forEach((o,j)=>{ if(o.correct) buttons[j].classList.add('correct'); });
    fb.className='feedback open ok';
    fb.innerHTML = `<b>✓ Correct! (Chính xác!)</b><span class="exp">${spec.explain}</span>`;
  }
  return wrap;
}

function exerciseBlock(spec){
  const revealKey = 'exrev_'+spec.id;
  QUIZ_REGISTRY.add(revealKey);
  const saved = store(revealKey);
  const wrap = el('div');
  wrap.appendChild(el('div',{class:'exercise-scenario'}, spec.scenario));
  const qBlock = quizBlock({id:'ex_'+spec.id, q:spec.q, qvi:spec.qvi, hint:spec.hint, options:spec.options, explain:spec.explain});
  wrap.appendChild(qBlock);
  const btn = el('button',{class:'reveal-btn'}, 'Show solution diagram (Xem sơ đồ lời giải)');
  const sol = el('div',{class:'solution'});
  sol.appendChild(el('h4',{},'Solution (Lời giải)'));
  sol.appendChild(renderDiagram(spec.diagram));
  if(spec.checks){
    const cl = el('ul',{class:'check-list'});
    spec.checks.forEach(c=>cl.appendChild(el('li',{},c)));
    sol.appendChild(cl);
  }
  btn.onclick=()=>{ sol.classList.toggle('open'); store(revealKey, true); updateProgress(); };
  wrap.appendChild(btn); wrap.appendChild(sol);
  if(saved) sol.classList.add('open');
  return wrap;
}

function updateProgress(){
  const total = QUIZ_REGISTRY.size;
  let done=0;
  QUIZ_REGISTRY.forEach(key=>{ if(store(key)!==null) done++; });
  const pct = total? Math.round(done/total*100):0;
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=pct+'% ('+done+'/'+total+')';
  document.getElementById('progressLabelTop').textContent=pct+'%';
}

function card(badge,title,bodyHTML){
  const c = el('div',{class:'card'});
  const h = el('h3');
  if(badge) h.appendChild(el('span',{class:'badge '+badge.cls}, badge.text));
  h.appendChild(document.createTextNode(title));
  c.appendChild(h);
  const body = el('div'); body.innerHTML = bodyHTML;
  c.appendChild(body);
  return c;
}
function diagramCard(badge,title,descHTML,diagramSpec){
  const c = card(badge,title,descHTML);
  c.appendChild(renderDiagram(diagramSpec));
  c.appendChild(legendBlock());
  return c;
}

SECTIONS.push({ id:'part5', label:'Part 5 · Sub-processes', labelVI:'Phần 5 · Quy trình con', build(container){

SECTIONS.push({ id:'summary', label:'Summary & quiz', labelVI:'Tổng kết & ôn tập', build(container){

      <li>Data objects and stores represent information and material; pools, lanes and message flows represent who does the work and how parties interact.</li>
      <li>Sub-processes and call activities keep large models readable and reusable.</li>

     options:[{t:'A thin-bordered circle (start event)',correct:true},{t:'A thick-bordered circle (end event)',correct:false},{t:'A diamond (gateway)',correct:false},{t:'A rounded rectangle (task)',correct:false}],
     explain:'Sự kiện bắt đầu được vẽ bằng hình tròn viền mảnh.'},
    {id:'f2', q:'Two activities must both complete, in any order, before the process continues. Which gateway pair fits?', qvi:'Hai hoạt động đều phải hoàn tất, không ràng buộc thứ tự, trước khi tiếp tục. Dùng cặp cổng nào?',
     options:[{t:'AND-split / AND-join',correct:true},{t:'XOR-split / XOR-join',correct:false},{t:'OR-split / OR-join',correct:false},{t:'No gateway needed',correct:false}],
     explain:'AND thực hiện tất cả các nhánh song song và chờ đồng bộ ở cổng gộp — đúng với yêu cầu "cả hai, không ràng buộc thứ tự".'},
    {id:'f3', q:'A rework loop (draft → review → repeat-if-rejected) should enter its repeating block through which gateway?', qvi:'Vòng lặp làm lại nên đi vào khối lặp qua cổng nào?',
     options:[{t:'An XOR-join',correct:true},{t:'An AND-join',correct:false},{t:'An OR-split',correct:false},{t:'A sub-process boundary, no gateway',correct:false}],
     explain:'Cổng gộp XOR nhận cả luồng ban đầu lẫn luồng quay lại; cổng gộp AND sẽ gây bế tắc vì chỉ một nhánh có token tại một thời điểm.'},
    {id:'f4', q:'A message flow may connect:', qvi:'Luồng thông điệp có thể nối:',
     options:[{t:'An activity in one pool to an activity in another pool',correct:true},{t:'Two activities in the same pool',correct:false},{t:'A gateway to a data store',correct:false},{t:'Two lanes of the same pool only',correct:false}],
     explain:'Luồng thông điệp luôn vượt ranh giới giữa các bể, không bao giờ nối hai hoạt động trong cùng một bể.'},
    {id:'f5', q:'When should a fragment of a model become a sub-process?', qvi:'Khi nào một đoạn mô hình nên trở thành quy trình con?',
     options:[{t:'When it is a cohesive, reusable unit or the model is getting too large (~30+ flow objects)',correct:true},{t:'Every single task must always be its own sub-process',correct:false},{t:'Only when the activity involves a software system',correct:false},{t:'Never — BPMN discourages sub-processes',correct:false}],
     explain:'Quy trình con dùng để giảm độ phức tạp (mô hình lớn) hoặc đóng gói một đơn vị nghiệp vụ có thể tái sử dụng (qua hoạt động gọi / mô hình quy trình toàn cục).'},
  ];
  finalQs.forEach(q=>container.appendChild(quizBlock(q)));
}});

/* ============================================================
   5. APP SHELL / ROUTER
   ============================================================ */
const content = document.getElementById('content');
const railNav = document.getElementById('railNav');
const tabsNav = document.getElementById('tabsNav');

SECTIONS.forEach((s,i)=>{
  const rb = el('button',{'data-id':s.id});
  rb.innerHTML = `<span class="n">${String(i).padStart(2,'0')}</span><span>${s.label}</span>`;
  rb.onclick=()=>{ location.hash = s.id; };
  railNav.appendChild(rb);

  const tb = el('button',{'data-id':s.id}, s.label.split(' · ').pop());
  tb.onclick=()=>{ location.hash = s.id; };
  tabsNav.appendChild(tb);
});

function renderSection(id){
  const sec = SECTIONS.find(s=>s.id===id) || SECTIONS[0];
  content.innerHTML = '';
  const head = el('div',{class:'section-head'});
  head.appendChild(el('div',{class:'eyebrow'}, sec.id==='intro'?'Overview':sec.id==='summary'?'Wrap-up':'Lesson section'));
  head.appendChild(el('h1',{}, sec.label.replace(/^Part \d+ · /,'').replace(/^Overview$/,'Essential Process Modeling with BPMN')));
  head.appendChild(el('div',{class:'section-sub'}, sec.labelVI));
  content.appendChild(head);
  sec.build(content);
  window.scrollTo(0,0);
  [...railNav.children].forEach(b=>b.classList.toggle('active', b.dataset.id===sec.id));
  [...tabsNav.children].forEach(b=>b.classList.toggle('active', b.dataset.id===sec.id));
}

window.addEventListener('hashchange', ()=>renderSection(location.hash.slice(1)));
renderSection(location.hash.slice(1) || 'intro');
updateProgress();
</script>
